<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDIコーディング</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

  :root{
    --bg:#f6f6f2;
    --surface:#ffffff;
    --surface-alt:#f0f0eb;
    --border:#e0dfd8;
    --text:#232420;
    --text-muted:#71716a;
    --accent:#2f6f6b;
    --accent-ink:#0f2e2c;
    --accent-soft:#e2efee;
    --warn:#b5482f;
    --warn-soft:#f6e6e1;
    --focus:#2f6f6b;
    --shadow: 0 1px 2px rgba(35,36,32,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16181a;
      --surface:#1e2123;
      --surface-alt:#25282b;
      --border:#33373a;
      --text:#eceae4;
      --text-muted:#9a9c96;
      --accent:#5fb3ac;
      --accent-ink:#eaf6f4;
      --accent-soft:#25332f;
      --warn:#e08064;
      --warn-soft:#3a2723;
      --shadow: 0 1px 3px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#16181a;
    --surface:#1e2123;
    --surface-alt:#25282b;
    --border:#33373a;
    --text:#eceae4;
    --text-muted:#9a9c96;
    --accent:#5fb3ac;
    --accent-ink:#eaf6f4;
    --accent-soft:#25332f;
    --warn:#e08064;
    --warn-soft:#3a2723;
    --shadow: 0 1px 3px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Archivo',"Hiragino Sans","Yu Gothic",sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 20px 64px;
  }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
  }
  h1{
    font-size:20px;
    font-weight:700;
    letter-spacing:0.01em;
    margin:0;
    text-wrap:balance;
  }
  .sub{
    font-size:12px;
    color:var(--text-muted);
    margin:2px 0 0;
  }

  .toolbar{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-bottom:14px;
  }
  .tbtn{
    border:1px solid var(--border);
    background:var(--surface-alt);
    color:var(--text);
    font-family:'Archivo',sans-serif;
    font-size:12px;
    font-weight:600;
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;
    transition:background .12s ease, transform .05s ease;
  }
  .tbtn:hover{ background:var(--border); }
  .tbtn:active{ transform:scale(0.97); }
  .tbtn:disabled{ opacity:0.4; cursor:not-allowed; }
  .tbtn.warn{ border-color:var(--warn); color:var(--warn); background:transparent; }
  .tbtn.warn:hover{ background:var(--warn-soft); }
  .tbtn.warn.armed{ background:var(--warn); border-color:var(--warn); color:#fff; }
  .tbtn:focus-visible, .row-btn:focus-visible, .step:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }

  .timer{
    display:flex;
    align-items:center;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:14px;
    box-shadow:var(--shadow);
  }
  .timer-label{ font-size:11px; color:var(--text-muted); font-weight:600; white-space:nowrap; }
  .timer .tbtn{ white-space:nowrap; }
  .timer-time{
    font-family:'IBM Plex Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:30px;
    font-weight:700;
    flex:1;
    text-align:center;
  }
  .timer.done{ background:var(--warn-soft); border-color:var(--warn); }
  .timer.done .timer-time{ color:var(--warn); animation:blink .6s steps(2) infinite; }
  @keyframes blink{ 50%{ opacity:0.35; } }

  #confetti{
    position:fixed; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:50;
  }
  .mastery{
    position:fixed; left:50%; top:38%;
    transform:translate(-50%,-50%) scale(0.6);
    z-index:51;
    background:var(--surface);
    border:2px solid var(--accent);
    border-radius:16px;
    padding:22px 28px;
    font-size:22px;
    font-weight:700;
    color:var(--accent-ink);
    text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,0.25);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s ease, transform .35s cubic-bezier(.2,1.4,.4,1);
    width:min(88vw, 420px);
  }
  .mastery.show{ opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto; cursor:pointer; }
  .mastery small{ display:block; font-size:11px; font-weight:500; color:var(--text-muted); margin-top:6px; }

  .list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .row{
    display:flex;
    align-items:stretch;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 10px 10px 14px;
    box-shadow:var(--shadow);
  }
  .row-id{
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-width:56px;
  }
  .code{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:17px;
    letter-spacing:0.02em;
  }
  .key{
    font-size:10px;
    color:var(--text-muted);
    margin-top:1px;
  }
  .count{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:52px;
    font-family:'IBM Plex Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:24px;
    font-weight:600;
    color:var(--text);
  }
  .row-btn{
    flex:1;
    border:none;
    border-radius:8px;
    background:var(--accent-soft);
    color:var(--accent-ink);
    font-family:'Archivo',sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:background .1s ease, transform .05s ease;
    min-height:52px;
  }
  .row-btn:hover{ background:var(--accent); color:#fff; }
  .row-btn:active{ transform:scale(0.98); }
  .stepper{
    display:flex;
    flex-direction:column;
    gap:4px;
    justify-content:center;
  }
  .step{
    width:34px;
    height:24px;
    border:1px solid var(--border);
    background:var(--surface-alt);
    color:var(--text-muted);
    border-radius:6px;
    font-size:14px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .step:hover{ background:var(--border); color:var(--text); }
  .step:active{ transform:scale(0.94); }

  @media (max-width: 640px){
    .wrap{ padding:22px 20px 44px; }
    header{ margin-bottom:14px; }
    .toolbar{ margin-bottom:11px; }
    .list{ gap:6px; }
    .row{ gap:8px; padding:8px 10px 8px 14px; }
    .row-btn{
      flex:0 0 auto;
      width:64px;
      font-size:11px;
      padding:0 4px;
      line-height:1.2;
    }
    .step{
      width:68px;
      height:38px;
      font-size:16px;
    }
    .stepper{ gap:4px; }
    .foot{ margin-top:14px; }
    .timer{ flex-wrap:wrap; gap:6px 8px; padding:8px 12px; }
    .timer-label{ flex:0 0 100%; }
    .timer-time{ font-size:30px; text-align:left; }
    .timer .tbtn{ padding:11px 12px; }
  }

  .foot{
    margin-top:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .hint{
    font-size:11px;
    color:var(--text-muted);
    line-height:1.6;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) translateY(8px);
    background:var(--text);
    color:var(--bg);
    font-size:12px;
    font-weight:600;
    padding:9px 16px;
    border-radius:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>CDIコーディング</h1>
      <p class="sub">観察コーディング用カウンター・全8項目</p>
    </div>
  </header>

  <div class="timer" id="timer">
    <span class="timer-label">5分タイマー</span>
    <span class="timer-time" id="timerTime">05:00</span>
    <button class="tbtn" id="timerStart">スタート</button>
    <button class="tbtn" id="timerReset">リセット</button>
  </div>

  <div class="toolbar">
    <button class="tbtn" id="undoBtn" disabled>元に戻す</button>
    <button class="tbtn" id="copyBtn">結果をコピー</button>
    <button class="tbtn warn" id="resetBtn">全リセット</button>
  </div>

  <div class="list" id="list"></div>

  <div class="foot">
    <p class="hint">大ボタン=+1(コーディング用)&nbsp;/&nbsp;小さい−・+=手動補正&nbsp;/&nbsp;数字キー1〜8でも+1&nbsp;/&nbsp;Zキーで元に戻す</p>
  </div>
</div>

<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>
<div class="mastery" id="mastery">🎉 マステリーおめでとうございます 🎉<small>5分経過時点で BD・RF・LPが各10以上、QU・CM・NTAの合計3以下</small></div>

<script>
(function(){
  var CODES = ["TA","BD","RF","LP","UP","QU","CM","NTA"];
  var STORAGE_KEY = "code-tally-v1";
  var counts = {};
  var history = [];
  CODES.forEach(function(c){ counts[c] = 0; });

  function loadSaved(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      var saved = JSON.parse(raw);
      CODES.forEach(function(c){
        if(typeof saved[c] === "number") counts[c] = saved[c];
      });
    }catch(e){ /* storage unavailable — start fresh */ }
  }
  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(counts)); }
    catch(e){ /* ignore */ }
  }

  var listEl = document.getElementById("list");
  var undoBtn = document.getElementById("undoBtn");
  var resetBtn = document.getElementById("resetBtn");
  var copyBtn = document.getElementById("copyBtn");
  var toastEl = document.getElementById("toast");
  var countEls = {};

  CODES.forEach(function(code, i){
    var row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<div class="row-id"><div class="code">' + code + '</div><div class="key">key ' + (i+1) + '</div></div>' +
      '<div class="count" id="count-' + code + '">0</div>' +
      '<button class="row-btn" data-code="' + code + '" data-delta="1">+1 コード</button>' +
      '<div class="stepper">' +
        '<button class="step" data-code="' + code + '" data-delta="1" aria-label="' + code + ' を手動で+1">+</button>' +
        '<button class="step" data-code="' + code + '" data-delta="-1" aria-label="' + code + ' を手動で-1">−</button>' +
      '</div>';
    listEl.appendChild(row);
    countEls[code] = document.getElementById("count-" + code);
  });

  function render(){
    CODES.forEach(function(c){
      countEls[c].textContent = counts[c];
    });
    undoBtn.disabled = history.length === 0;
    persist();
    checkMastery();
  }

  function apply(code, delta, record){
    counts[code] = Math.max(0, counts[code] + delta);
    if(record !== false) history.push({code: code, delta: delta});
    render();
  }

  function undo(){
    if(history.length === 0) return;
    var last = history.pop();
    counts[last.code] = Math.max(0, counts[last.code] - last.delta);
    render();
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.remove("show"); }, 1600);
  }

  listEl.addEventListener("click", function(e){
    var btn = e.target.closest("[data-code]");
    if(!btn) return;
    apply(btn.getAttribute("data-code"), parseInt(btn.getAttribute("data-delta"), 10));
  });

  undoBtn.addEventListener("click", undo);

  var resetArmed = false;
  var resetTimer = null;
  resetBtn.addEventListener("click", function(){
    if(!resetArmed){
      resetArmed = true;
      resetBtn.textContent = "本当にリセット？";
      resetBtn.classList.add("armed");
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function(){
        resetArmed = false;
        resetBtn.textContent = "全リセット";
        resetBtn.classList.remove("armed");
      }, 3000);
      return;
    }
    clearTimeout(resetTimer);
    resetArmed = false;
    resetBtn.textContent = "全リセット";
    resetBtn.classList.remove("armed");
    CODES.forEach(function(c){ counts[c] = 0; });
    history = [];
    render();
    showToast("リセットしました");
  });

  copyBtn.addEventListener("click", function(){
    var total = CODES.reduce(function(s,c){ return s + counts[c]; }, 0);
    var parts = CODES.map(function(c){ return c + counts[c]; });
    parts.push("合計" + total);
    var text = parts.join(" ");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast("結果をコピーしました");
      }).catch(function(){
        showToast(text);
      });
    }else{
      showToast(text);
    }
  });

  document.addEventListener("keydown", function(e){
    if(e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
    var n = parseInt(e.key, 10);
    if(n >= 1 && n <= CODES.length){
      apply(CODES[n-1], 1);
      return;
    }
    if(e.key === "z" || e.key === "Z"){
      undo();
    }
  });

  // ---- 5分タイマー ----
  var DURATION = 5 * 60 * 1000;
  var timerEl = document.getElementById("timer");
  var timeEl = document.getElementById("timerTime");
  var startBtn = document.getElementById("timerStart");
  var tResetBtn = document.getElementById("timerReset");
  var endAt = 0, remaining = DURATION, tick = null, running = false;
  var audioCtx = null, alarmTimer = null;
  var timerDone = false; // 5分経過済みか（マステリー判定の条件）

  function fmt(ms){
    var s = Math.ceil(ms / 1000);
    var m = Math.floor(s / 60);
    s = s % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function beep(){
    if(!audioCtx) return;
    [0, 0.25, 0.5].forEach(function(d){
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = "square";
      o.frequency.value = 880;
      g.gain.value = 0.15;
      o.connect(g); g.connect(audioCtx.destination);
      var t = audioCtx.currentTime + d;
      o.start(t); o.stop(t + 0.15);
    });
  }
  function stopAlarm(){
    clearInterval(alarmTimer); alarmTimer = null;
    timerEl.classList.remove("done");
  }
  function startAlarm(){
    timerEl.classList.add("done");
    beep();
    alarmTimer = setInterval(beep, 1500);
    if(navigator.vibrate) navigator.vibrate([300,150,300,150,300]);
  }
  function update(){
    var left = endAt - Date.now();
    if(left <= 0){
      clearInterval(tick); tick = null;
      running = false; remaining = 0;
      timeEl.textContent = "00:00";
      startBtn.textContent = "停止";
      timerDone = true;
      startAlarm();
      checkMastery();
      return;
    }
    timeEl.textContent = fmt(left);
  }
  function timerReset(keepDone){
    clearInterval(tick); tick = null;
    stopAlarm();
    running = false; remaining = DURATION;
    timeEl.textContent = fmt(DURATION);
    startBtn.textContent = "スタート";
    if(!keepDone){ timerDone = false; checkMastery(); }
  }
  startBtn.addEventListener("click", function(){
    if(alarmTimer){ timerReset(true); return; } // アラーム停止（判定結果は残す）
    if(timerDone){ timerDone = false; checkMastery(); }
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    if(running){
      remaining = endAt - Date.now();
      clearInterval(tick); tick = null; running = false;
      startBtn.textContent = "再開";
    }else{
      endAt = Date.now() + remaining;
      running = true;
      startBtn.textContent = "一時停止";
      tick = setInterval(update, 200);
      update();
    }
  });
  tResetBtn.addEventListener("click", function(){ timerReset(false); });

  // ---- マステリー判定 ----
  var masteryEl = document.getElementById("mastery");
  var cv = document.getElementById("confetti");
  var cx = cv.getContext("2d");
  var pieces = [], anim = null, masteryHide = null, prevMet = false;

  function isMet(){
    return counts.BD >= 10 && counts.RF >= 10 && counts.LP >= 10 &&
           (counts.QU + counts.CM + counts.NTA) <= 3;
  }
  function pop(delay){
    if(!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(!audioCtx) return;
    if(audioCtx.state === "suspended") audioCtx.resume();
    var len = Math.floor(audioCtx.sampleRate * 0.25);
    var buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    var d = buf.getChannelData(0);
    for(var i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 4);
    var src = audioCtx.createBufferSource();
    var g = audioCtx.createGain();
    g.gain.value = 0.12;
    src.buffer = buf;
    src.connect(g); g.connect(audioCtx.destination);
    src.start(audioCtx.currentTime + delay);
  }
  function burst(x, angleDeg){
    var colors = ["#e74c3c","#f1c40f","#2ecc71","#3498db","#9b59b6","#ff7eb6","#ff9f1c"];
    for(var i = 0; i < 70; i++){
      var a = (angleDeg + (Math.random()-0.5)*50) * Math.PI/180;
      var sp = 9 + Math.random()*11;
      pieces.push({
        x:x, y:cv.height,
        vx:Math.cos(a)*sp, vy:-Math.sin(a)*sp,
        w:6+Math.random()*6, h:4+Math.random()*6,
        r:Math.random()*6, vr:(Math.random()-0.5)*0.4,
        c:colors[Math.floor(Math.random()*colors.length)]
      });
    }
  }
  function frame(){
    cx.clearRect(0, 0, cv.width, cv.height);
    pieces = pieces.filter(function(p){ return p.y < cv.height + 20; });
    pieces.forEach(function(p){
      p.vy += 0.35; p.vx *= 0.99; p.vy *= 0.99;
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      cx.save();
      cx.translate(p.x, p.y); cx.rotate(p.r);
      cx.fillStyle = p.c;
      cx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      cx.restore();
    });
    if(pieces.length){ anim = requestAnimationFrame(frame); }
    else{ anim = null; cx.clearRect(0, 0, cv.width, cv.height); }
  }
  function hideMastery(){
    masteryEl.classList.remove("show");
    clearTimeout(masteryHide);
  }
  function celebrate(){
    cv.width = window.innerWidth; cv.height = window.innerHeight;
    burst(0, 60); burst(cv.width, 120);
    pop(0); pop(0.05);
    setTimeout(function(){
      burst(cv.width*0.25, 75); burst(cv.width*0.75, 105); pop(0);
    }, 450);
    masteryEl.classList.add("show");
    clearTimeout(masteryHide);
    masteryHide = setTimeout(hideMastery, 7000);
    if(!anim) anim = requestAnimationFrame(frame);
  }
  masteryEl.addEventListener("click", hideMastery);
  function checkMastery(){
    var met = timerDone && isMet(); // 5分経過後のみ有効
    if(met && !prevMet) celebrate();
    if(!met) hideMastery();
    prevMet = met;
  }

  loadSaved();
  prevMet = false;
  render();
})();
</script>
</body>
</html>
