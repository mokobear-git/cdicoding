<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDIコーディング</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

  :root{
    --bg:#f6f6f2;
    --surface:#ffffff;
    --surface-alt:#f0f0eb;
    --border:#e0dfd8;
    --text:#232420;
    --text-muted:#71716a;
    --accent:#2f6f6b;
    --accent-ink:#0f2e2c;
    --accent-soft:#e2efee;
    --warn:#b5482f;
    --warn-soft:#f6e6e1;
    --focus:#2f6f6b;
    --shadow: 0 1px 2px rgba(35,36,32,0.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16181a;
      --surface:#1e2123;
      --surface-alt:#25282b;
      --border:#33373a;
      --text:#eceae4;
      --text-muted:#9a9c96;
      --accent:#5fb3ac;
      --accent-ink:#eaf6f4;
      --accent-soft:#25332f;
      --warn:#e08064;
      --warn-soft:#3a2723;
      --shadow: 0 1px 3px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#16181a;
    --surface:#1e2123;
    --surface-alt:#25282b;
    --border:#33373a;
    --text:#eceae4;
    --text-muted:#9a9c96;
    --accent:#5fb3ac;
    --accent-ink:#eaf6f4;
    --accent-soft:#25332f;
    --warn:#e08064;
    --warn-soft:#3a2723;
    --shadow: 0 1px 3px rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Archivo',"Hiragino Sans","Yu Gothic",sans-serif;
    min-height:100vh;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:28px 20px 64px;
  }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:18px;
  }
  h1{
    font-size:20px;
    font-weight:700;
    letter-spacing:0.01em;
    margin:0;
    text-wrap:balance;
  }
  .sub{
    font-size:12px;
    color:var(--text-muted);
    margin:2px 0 0;
  }

  .toolbar{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-bottom:14px;
  }
  .tbtn{
    border:1px solid var(--border);
    background:var(--surface-alt);
    color:var(--text);
    font-family:'Archivo',sans-serif;
    font-size:12px;
    font-weight:600;
    padding:9px 12px;
    border-radius:8px;
    cursor:pointer;
    transition:background .12s ease, transform .05s ease;
  }
  .tbtn:hover{ background:var(--border); }
  .tbtn:active{ transform:scale(0.97); }
  .tbtn:disabled{ opacity:0.4; cursor:not-allowed; }
  .tbtn.warn{ border-color:var(--warn); color:var(--warn); background:transparent; }
  .tbtn.warn:hover{ background:var(--warn-soft); }
  .tbtn.warn.armed{ background:var(--warn); border-color:var(--warn); color:#fff; }
  .tbtn:focus-visible, .row-btn:focus-visible, .step:focus-visible{
    outline:2px solid var(--focus);
    outline-offset:2px;
  }

  .list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .row{
    display:flex;
    align-items:stretch;
    gap:10px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 10px 10px 14px;
    box-shadow:var(--shadow);
  }
  .row-id{
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-width:56px;
  }
  .code{
    font-family:'IBM Plex Mono',monospace;
    font-weight:700;
    font-size:17px;
    letter-spacing:0.02em;
  }
  .key{
    font-size:10px;
    color:var(--text-muted);
    margin-top:1px;
  }
  .count{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:52px;
    font-family:'IBM Plex Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:24px;
    font-weight:600;
    color:var(--text);
  }
  .row-btn{
    flex:1;
    border:none;
    border-radius:8px;
    background:var(--accent-soft);
    color:var(--accent-ink);
    font-family:'Archivo',sans-serif;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:background .1s ease, transform .05s ease;
    min-height:52px;
  }
  .row-btn:hover{ background:var(--accent); color:#fff; }
  .row-btn:active{ transform:scale(0.98); }
  .stepper{
    display:flex;
    flex-direction:column;
    gap:4px;
    justify-content:center;
  }
  .step{
    width:34px;
    height:24px;
    border:1px solid var(--border);
    background:var(--surface-alt);
    color:var(--text-muted);
    border-radius:6px;
    font-size:14px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .step:hover{ background:var(--border); color:var(--text); }
  .step:active{ transform:scale(0.94); }

  @media (max-width: 640px){
    .row-btn{
      flex:0 0 auto;
      width:64px;
      font-size:11px;
      padding:0 4px;
      line-height:1.2;
    }
    .step{
      width:68px;
      height:48px;
      font-size:20px;
    }
    .stepper{ gap:6px; }
    .row{ gap:8px; }
  }

  .foot{
    margin-top:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .hint{
    font-size:11px;
    color:var(--text-muted);
    line-height:1.6;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) translateY(8px);
    background:var(--text);
    color:var(--bg);
    font-size:12px;
    font-weight:600;
    padding:9px 16px;
    border-radius:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease, transform .15s ease;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>CDIコーディング</h1>
      <p class="sub">観察コーディング用カウンター・全8項目</p>
    </div>
  </header>

  <div class="toolbar">
    <button class="tbtn" id="undoBtn" disabled>元に戻す</button>
    <button class="tbtn" id="copyBtn">結果をコピー</button>
    <button class="tbtn warn" id="resetBtn">全リセット</button>
  </div>

  <div class="list" id="list"></div>

  <div class="foot">
    <p class="hint">大ボタン=+1(コーディング用)&nbsp;/&nbsp;小さい−・+=手動補正&nbsp;/&nbsp;数字キー1〜8でも+1&nbsp;/&nbsp;Zキーで元に戻す</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var CODES = ["TA","BD","RF","LP","UP","QU","CM","NTA"];
  var STORAGE_KEY = "code-tally-v1";
  var counts = {};
  var history = [];
  CODES.forEach(function(c){ counts[c] = 0; });

  function loadSaved(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return;
      var saved = JSON.parse(raw);
      CODES.forEach(function(c){
        if(typeof saved[c] === "number") counts[c] = saved[c];
      });
    }catch(e){ /* storage unavailable — start fresh */ }
  }
  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(counts)); }
    catch(e){ /* ignore */ }
  }

  var listEl = document.getElementById("list");
  var undoBtn = document.getElementById("undoBtn");
  var resetBtn = document.getElementById("resetBtn");
  var copyBtn = document.getElementById("copyBtn");
  var toastEl = document.getElementById("toast");
  var countEls = {};

  CODES.forEach(function(code, i){
    var row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<div class="row-id"><div class="code">' + code + '</div><div class="key">key ' + (i+1) + '</div></div>' +
      '<div class="count" id="count-' + code + '">0</div>' +
      '<button class="row-btn" data-code="' + code + '" data-delta="1">+1 コード</button>' +
      '<div class="stepper">' +
        '<button class="step" data-code="' + code + '" data-delta="1" aria-label="' + code + ' を手動で+1">+</button>' +
        '<button class="step" data-code="' + code + '" data-delta="-1" aria-label="' + code + ' を手動で-1">−</button>' +
      '</div>';
    listEl.appendChild(row);
    countEls[code] = document.getElementById("count-" + code);
  });

  function render(){
    CODES.forEach(function(c){
      countEls[c].textContent = counts[c];
    });
    undoBtn.disabled = history.length === 0;
    persist();
  }

  function apply(code, delta, record){
    counts[code] = Math.max(0, counts[code] + delta);
    if(record !== false) history.push({code: code, delta: delta});
    render();
  }

  function undo(){
    if(history.length === 0) return;
    var last = history.pop();
    counts[last.code] = Math.max(0, counts[last.code] - last.delta);
    render();
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ toastEl.classList.remove("show"); }, 1600);
  }

  listEl.addEventListener("click", function(e){
    var btn = e.target.closest("[data-code]");
    if(!btn) return;
    apply(btn.getAttribute("data-code"), parseInt(btn.getAttribute("data-delta"), 10));
  });

  undoBtn.addEventListener("click", undo);

  var resetArmed = false;
  var resetTimer = null;
  resetBtn.addEventListener("click", function(){
    if(!resetArmed){
      resetArmed = true;
      resetBtn.textContent = "本当にリセット？";
      resetBtn.classList.add("armed");
      clearTimeout(resetTimer);
      resetTimer = setTimeout(function(){
        resetArmed = false;
        resetBtn.textContent = "全リセット";
        resetBtn.classList.remove("armed");
      }, 3000);
      return;
    }
    clearTimeout(resetTimer);
    resetArmed = false;
    resetBtn.textContent = "全リセット";
    resetBtn.classList.remove("armed");
    CODES.forEach(function(c){ counts[c] = 0; });
    history = [];
    render();
    showToast("リセットしました");
  });

  copyBtn.addEventListener("click", function(){
    var total = CODES.reduce(function(s,c){ return s + counts[c]; }, 0);
    var parts = CODES.map(function(c){ return c + counts[c]; });
    parts.push("合計" + total);
    var text = parts.join(" ");
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        showToast("結果をコピーしました");
      }).catch(function(){
        showToast(text);
      });
    }else{
      showToast(text);
    }
  });

  document.addEventListener("keydown", function(e){
    if(e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
    var n = parseInt(e.key, 10);
    if(n >= 1 && n <= CODES.length){
      apply(CODES[n-1], 1);
      return;
    }
    if(e.key === "z" || e.key === "Z"){
      undo();
    }
  });

  loadSaved();
  render();
})();
</script>
</body>
</html>
